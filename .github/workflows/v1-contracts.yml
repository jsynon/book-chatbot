name: Reading Companion v1.4.6 contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reading-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create synthetic source book for contract tests
        env:
          BOOK_CHATBOT_BOOK_FILE: ${{ runner.temp }}/book-7.json.gz
        run: |
          python - <<'PY'
          import gzip
          import json
          import os
          with gzip.open(os.environ["BOOK_CHATBOT_BOOK_FILE"], "wt", encoding="utf-8") as file:
              json.dump({"pages": [
                  {"page": 1, "text": "Reading is an activity requiring attention and practice. Good interpretations must be checked against the original text."},
                  {"page": 2, "text": "Scholarly questions call for evidence. A citation gives a reader an opportunity to verify a claim."}
              ]}, file)
          PY
      - name: Compile reading and library modules
        run: |
          python -m compileall -q source_reader.py app.py benchmark_suite.py passage_quality.py evidence_structure.py evidence_coverage.py quote_audit.py whole_library.py retrieval_relevance.py conceptual_retrieval.py library_catalog.py evidence_pipeline.py direct_pipeline.py grounded_pipeline.py inference.py scripts tests
      - name: Check browser script syntax and controls
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!match) throw new Error('Expected inline application script');
          new vm.Script(match[1], {filename: 'index.html'});
          for (const name of ['id="pipeline"', 'id="compare-pipelines"', 'id="test-suite"', 'Key passages from the source books', "['evidence', 'direct']", 'id="book"', 'id="book-filter"', 'id="search-scope"', 'id="library-prompts"', 'id="discipline-tests"', 'id="discipline-case"']) {
            if (!html.includes(name)) throw new Error('Missing model-comparison control: ' + name);
          }
          // Runtime locator smoke check: a wrongly escaped digit regex in
          // v1.6.0 silently disabled every in-page citation and Read button.
          const locatorStart = html.indexOf('function isReadableSourceLocator(source, page) {');
          const locatorEnd = html.indexOf('async function openSourcePage', locatorStart);
          if (locatorStart < 0 || locatorEnd < 0) {
            throw new Error('Missing source reader locator validation');
          }
          const locatorDefinition = html.slice(locatorStart, locatorEnd);
          const isReadable = vm.runInNewContext(locatorDefinition + '; isReadableSourceLocator;');
          if (!isReadable({book_id:'140'}, 179) || !isReadable({book_id:'7'}, '3')) {
            throw new Error('Valid numeric book/page citation does not open the source reader');
          }
          if (isReadable({book_id:'../7'},179) || isReadable({book_id:'7'},'abc')) {
            throw new Error('Invalid source locator accepted');
          }
          console.log('Source reader activation and locator contract OK.');
          const formatting = require('./source_text_format.js');
          const sample = '    He knows that when someone speaks at\n    length the meaning is not changed.\n\n    A second paragraph remains separate.';
          const readable = formatting.readableParagraphs(sample);
          if (readable.length !== 2 || readable[0] !== 'He knows that when someone speaks at length the meaning is not changed.' || readable[1] !== 'A second paragraph remains separate.') {
            throw new Error('OCR prose reflow changed content or paragraph boundaries');
          }
          if (!html.includes('id="source-layout"') || !html.includes('displaySourceText();')) {
            throw new Error('Missing source reader layout controls');
          }
          const citeText = 'He understands the question, and he knows that the most important point must be stated plainly before the discussion continues.';
          const wrappedPage = 'Introduction.\n\n  He understands the\n question, and he knows that the most important point must\n be stated plainly before the discussion continues.\n\nLater.';
          const displayPage = formatting.readableParagraphs(wrappedPage).join('\n\n');
          const found = formatting.locateCitedExcerpt(displayPage, citeText);
          if (!found || displayPage.slice(found.start,found.end) !== citeText.replace(/[.!?]$/, '') || found.partial) {
            throw new Error('Failed to locate exact quoted passage across OCR wraps');
          }
          if (formatting.locateCitedExcerpt('The night is dark. The night is dark.', 'The night is dark.')) {
            throw new Error('Short ambiguous phrase should never be highlighted');
          }
          const twoPages = 'An isolated introduction to the subject.\n\n' + citeText.split(' ').slice(0,15).join(' ');
          const partial = formatting.locateCitedExcerpt(twoPages, citeText);
          if (!partial || !partial.partial) {
            throw new Error('Cross-page partial quotation should locate a distinctive continuous span');
          }
          if (!html.includes('cited-highlight') || !html.includes('appendMarkedText')) {
            throw new Error('Missing source reader highlight rendering');
          }
          console.log('Browser script syntax and comparison controls OK.');
          JS
      - name: Test bounded library retrieval and evidence pipeline contracts
        env:
          BOOK_CHATBOT_BOOK_FILE: ${{ runner.temp }}/book-7.json.gz
        run: |
          python -m unittest discover -s tests -p 'test_*pipeline.py' -v
          python -m unittest discover -s tests -p 'test_library_catalog.py' -v
          python -m unittest discover -s tests -p 'test_whole_library.py' -v
          python -m unittest discover -s tests -p 'test_retrieval_relevance.py' -v
          python -m unittest discover -s tests -p 'test_conceptual_retrieval.py' -v
          python -m unittest discover -s tests -p 'test_cross_discipline_benchmark.py' -v
          python -m unittest discover -s tests -p 'test_passage_quality.py' -v
          python -m unittest discover -s tests -p 'test_evidence_coverage.py' -v
          python -m unittest discover -s tests -p 'test_evidence_structure.py' -v
          python -m unittest discover -s tests -p 'test_source_reader.py' -v
          python scripts/run_cross_discipline.py --list
